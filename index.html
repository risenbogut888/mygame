<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Сашкины члены</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: #e8e8ec;
    font-family: Arial, sans-serif;
    color: #222;
    overflow: hidden;
    user-select: none;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;
    padding: 10px;
  }
  #hud { font-size: 18px; color: #333; }
  #hud span { font-weight: bold; }
  canvas {
    background: #f5f5f8;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(0,0,0,0.15);
    touch-action: none;
    max-width: 100%;
    max-height: 70vh;
  }
  #controls { display: flex; gap: 20px; }
  .btn {
    width: 90px; height: 70px;
    border-radius: 16px; border: none;
    background: #4ade80; color: #1e1e2e;
    font-size: 36px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 0 #22a55a;
    transition: transform 0.05s, box-shadow 0.05s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #22a55a; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="hud">
    Очки: <span id="score">0</span> &nbsp;|&nbsp; Жизни: <span id="lives">3</span>
  </div>
  <div id="controls">
    <button class="btn" id="btnLeft">◀</button>
    <button class="btn" id="btnRight">▶</button>
  </div>
</div>

<script>
// ============================================================
//  КАРТИНКИ
// ============================================================
const PLAYER_IMG_SRC = 'player.png'; // 150x150
const GOOD_IMG_SRC   = 'good.png';   // 80x80
const BAD_IMG_SRC    = 'bad.png';    // 80x80
// ============================================================

// ---- НАСТРОЙКИ ----
const BAD_CHANCE  = 0.15;   // 15% плохих
const START_LIVES = 3;
// --------------------

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

function loadImg(src) {
  const img = new Image();
  img.src = src;
  img.onerror = () => console.warn('Не нашёл картинку:', src);
  return img;
}
const playerImg = loadImg(PLAYER_IMG_SRC);
const goodImg   = loadImg(GOOD_IMG_SRC);
const badImg    = loadImg(BAD_IMG_SRC);

const PLAYER_SIZE = 150;
const player = {
  w: PLAYER_SIZE,
  h: PLAYER_SIZE,
  x: W / 2 - PLAYER_SIZE / 2,
  y: H - PLAYER_SIZE - 20,
  speed: 8
};

const ITEM_SIZE = 80;

let items = [];
let score = 0;
let lives = START_LIVES;

// Состояния: 'splash' | 'start' | 'playing' | 'over'
let state = 'splash';

const keys = {};
let moveLeft = false;
let moveRight = false;

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (state === 'splash' && (e.key === ' ' || e.key === 'Enter')) state = 'start';
  if (state === 'start' && (e.key === ' ' || e.key === 'Enter')) startGame();
  if (state === 'over'  && (e.key === ' ' || e.key === 'Enter')) restart();
});
document.addEventListener('keyup', e => keys[e.key] = false);

function bindHold(el, setter) {
  const on  = e => { e.preventDefault(); setter(true);  };
  const off = e => { e.preventDefault(); setter(false); };
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
  el.addEventListener('touchstart', on, { passive: false });
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
}
bindHold(document.getElementById('btnLeft'),  v => moveLeft = v);
bindHold(document.getElementById('btnRight'), v => moveRight = v);

canvas.addEventListener('touchstart', e => {
  if (state === 'splash') { e.preventDefault(); state = 'start'; }
  else if (state === 'start') { e.preventDefault(); startGame(); }
  else if (state === 'over') { e.preventDefault(); restart(); }
}, { passive: false });
canvas.addEventListener('click', () => {
  if (state === 'splash') state = 'start';
  else if (state === 'start') startGame();
  else if (state === 'over') restart();
});

let spawnTimer = 0;
let spawnInterval = 55;

// ---- СПАВН ----
function spawnItem() {
  const isBad = Math.random() < BAD_CHANCE;
  items.push({
    x: Math.random() * (W - ITEM_SIZE),
    y: -ITEM_SIZE,
    size: ITEM_SIZE,
    speed: 2 + Math.random() * 2 + score * 0.03,
    isBad: isBad,
    img: isBad ? badImg : goodImg,
    rot: (Math.random() - 0.5) * 0.6
  });
}

// ---- ОБНОВЛЕНИЕ ----
function update() {
  // Заставка — ждёт касания
  if (state === 'splash') return;

  if (state !== 'playing') return;

  const left  = keys['ArrowLeft']  || keys['a'] || keys['A'] || moveLeft;
  const right = keys['ArrowRight'] || keys['d'] || keys['D'] || moveRight;
  if (left)  player.x -= player.speed;
  if (right) player.x += player.speed;
  player.x = Math.max(0, Math.min(W - player.w, player.x));

  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnItem();
    spawnInterval = Math.max(25, 55 - Math.floor(score / 3));
  }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.speed;

    const caught =
      it.y + it.size >= player.y &&
      it.y <= player.y + player.h &&
      it.x + it.size >= player.x &&
      it.x <= player.x + player.w;

    if (caught) {
      items.splice(i, 1);

      if (it.isBad === true) {
        lives--;
        document.getElementById('lives').textContent = lives;
        if (lives <= 0) state = 'over';
      } else {
        score++;
        document.getElementById('score').textContent = score;
      }
      continue;
    }

    if (it.y > H) {
      items.splice(i, 1);
    }
  }
}

function wrapText(text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n] + ' ';
    const metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth && n > 0) {
      ctx.fillText(line.trim(), x, y);
      line = words[n] + ' ';
      y += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line.trim(), x, y);
  return y + lineHeight;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#f5f5f8';
  ctx.fillRect(0, 0, W, H);

  // ---- Заставка ----
  if (state === 'splash') {
    ctx.fillStyle = '#222';
    ctx.textAlign = 'center';

    ctx.font = 'bold 34px Arial';
    ctx.fillText('Сашкины члены', W / 2, H / 2 - 30);

    ctx.font = 'bold 24px Arial';
    ctx.fillStyle = '#22a55a';
    ctx.fillText('версия 1', W / 2, H / 2 + 20);

    ctx.font = '16px Arial';
    ctx.fillStyle = '#22a55a';
    ctx.fillText('Коснись экрана, чтобы продолжить', W / 2, H - 60);
    return;
  }

  // ---- Стартовый экран ----
  if (state === 'start') {
    ctx.fillStyle = '#222';
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Игра', W / 2, 70);

    ctx.font = '20px Arial';
    ctx.fillStyle = '#333';
    const text = 'Сашка, любит члены, помоги ему собрать их. Остерегайся членов негра';
    wrapText(text, W / 2, 140, W - 60, 30);

    if (playerImg.complete && playerImg.naturalWidth) {
      ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);
    }

    ctx.fillStyle = '#22a55a';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('Коснись экрана, чтобы начать', W / 2, H - 60);
    return;
  }

  // ---- Игрок ----
  if (playerImg.complete && playerImg.naturalWidth) {
    ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);
  } else {
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(player.x, player.y, player.w, player.h);
  }

  // ---- Предметы ----
  for (const it of items) {
    ctx.save();
    ctx.translate(it.x + it.size / 2, it.y + it.size / 2);
    ctx.rotate(it.rot);
    if (it.img.complete && it.img.naturalWidth) {
      ctx.drawImage(it.img, -it.size / 2, -it.size / 2, it.size, it.size);
    } else {
      ctx.fillStyle = it.isBad ? '#ef4444' : '#fbbf24';
      ctx.fillRect(-it.size / 2, -it.size / 2, it.size, it.size);
    }
    ctx.restore();
  }

  // ---- Game Over ----
  if (state === 'over') {
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#222';
    ctx.textAlign = 'center';

    ctx.font = 'bold 28px Arial';
    ctx.fillText('Игра окончена', W / 2, H / 2 - 90);

    ctx.font = '20px Arial';
    ctx.fillStyle = '#333';
    const overText = 'Сашка, поймал слишком длинный хуй, начни заново';
    wrapText(overText, W / 2, H / 2 - 30, W - 60, 30);

    ctx.font = 'bold 22px Arial';
    ctx.fillStyle = '#222';
    ctx.fillText('Очки: ' + score, W / 2, H / 2 + 60);

    ctx.font = '18px Arial';
    ctx.fillStyle = '#22a55a';
    ctx.fillText('Коснись экрана, чтобы начать заново', W / 2, H / 2 + 120);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function startGame() {
  state = 'playing';
  items = [];
  score = 0;
  lives = START_LIVES;
  spawnTimer = 0;
  spawnInterval = 55;
  player.x = W / 2 - player.w / 2;
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
}

function restart() { startGame(); }

loop();
</script>
</body>
</html>
